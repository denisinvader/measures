name: Bug report
description: Report something that does not work as expected.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: >-
        Describe one problem per report. Remove private URLs, page content, and personal information before sharing details.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and where you encountered it.
      placeholder: A short description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that make the problem happen.
      placeholder: |
        1. Open …
        2. Move the pointer to …
        3. See the problem
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: Describe the expected behavior.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      placeholder: Describe what you saw.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the browser and version, Measures version, and whether you use the extension or script.
      placeholder: |
        Browser and version:
        Measures version:
        Extension or script:
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or errors
      description: Add screenshots, console errors, or other details that help reproduce the problem. Check them for private information first.
    validations:
      required: false
